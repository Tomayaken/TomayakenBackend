services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tomayaken
      POSTGRES_PASSWORD: tomayaken
      POSTGRES_DB: tomayaken
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomayaken -d tomayaken"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
